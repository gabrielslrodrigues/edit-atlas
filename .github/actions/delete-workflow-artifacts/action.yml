name: Delete workflow artifacts
description: Delete matching artifacts produced by the current workflow run

inputs:
  pattern:
    description: Regular expression matched against complete artifact names
    required: true

runs:
  using: composite
  steps:
    - name: Delete matching artifacts
      uses: actions/github-script@v8
      env:
        EDIT_ATLAS_ARTIFACT_PATTERN: ${{ inputs.pattern }}
      with:
        script: |
          const pattern = new RegExp(
            process.env.EDIT_ATLAS_ARTIFACT_PATTERN,
          );
          const artifacts = await github.paginate(
            github.rest.actions.listWorkflowRunArtifacts,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            },
          );
          for (const artifact of artifacts) {
            if (!pattern.test(artifact.name)) {
              continue;
            }
            core.info(`Deleting transient artifact: ${artifact.name}`);
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
            });
          }

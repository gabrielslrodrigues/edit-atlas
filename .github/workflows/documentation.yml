name: Documentation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: Published release tag to document
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    name: Generate API documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Validate published release
        if: inputs.version != ''
        shell: bash
        env:
          DOCUMENTATION_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$DOCUMENTATION_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Documentation version must use the vX.Y.Z form." >&2
            exit 1
          fi
          release_is_draft="$(
            gh release view "$DOCUMENTATION_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft
          )"
          if [[ "$release_is_draft" != "false" ]]; then
            echo "Release $DOCUMENTATION_VERSION is not published." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends doxygen graphviz

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.4.0

      - name: Restore published Pages source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p build/pages
          if git fetch origin gh-pages; then
            git archive FETCH_HEAD | tar -x -C build/pages
          fi

      - name: Generate documentation
        run: cmake --workflow --preset documentation

      - name: Assemble versioned documentation site
        shell: bash
        env:
          DOCUMENTATION_VERSION: ${{ inputs.version || '' }}
        run: >-
          ./scripts/ci/assemble-github-pages-docs.sh
          build/documentation/docs/html
          build/pages
          "$DOCUMENTATION_VERSION"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-api-documentation
          path: build/documentation/docs/html
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages source
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-pages-source
          path: build/pages
          if-no-files-found: error
          retention-days: 7

  publish-source:
    name: Persist Pages source
    if: >-
      inputs.version != '' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download Pages source
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-pages-source
          path: build/pages

      - name: Persist Pages source branch
        run: ./scripts/ci/persist-github-pages-source.sh build/pages

  deploy:
    name: Deploy API documentation
    if: >-
      inputs.version != '' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs:
      - generate
      - publish-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            triplet: x64-linux
          - name: macOS ARM64
            os: macos-15
            triplet: arm64-osx
          - name: Windows x64
            os: windows-2022
            triplet: x64-windows

    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite
      VCPKG_DISABLE_METRICS: 1

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install Linux host dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-util-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxcb1-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrender-dev \
            pkg-config

      - name: Install macOS host dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.4.0

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6.1.0
        with:
          path: .cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure Debug
        run: cmake --preset debug

      - name: Build Debug
        run: cmake --build --preset debug

      - name: Configure Release
        run: cmake --preset release

      - name: Build Release
        run: cmake --build --preset release

      - name: Upload configuration logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-configuration-logs
          path: |
            build/*/CMakeFiles/CMakeConfigureLog.yaml
            build/*/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7

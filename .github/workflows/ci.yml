name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build and package
    uses: ./.github/workflows/build-and-package.yml
    permissions:
      actions: write
      contents: read
      packages: write

  package-verification:
    name: Verify packages
    needs: packages
    if: always() && needs.packages.result == 'success'
    uses: ./.github/workflows/package-verification.yml
    permissions:
      contents: read

  packaged-e2e:
    name: Packaged E2E
    needs: packages
    if: always() && needs.packages.result == 'success'
    uses: ./.github/workflows/packaged-e2e.yml
    permissions:
      contents: read

  cleanup-artifacts:
    name: Remove transient workflow artifacts
    needs:
      - packages
      - package-verification
      - packaged-e2e
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Delete transfer artifacts
        uses: ./.github/actions/delete-workflow-artifacts
        with:
          pattern: >-
            ^(?:(widgets|quick)-frontend-.*-(packages|stage)|edit-atlas-e2e-media-fixtures)$

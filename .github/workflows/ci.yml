name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-tag:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        run: ./scripts/ci/validate-release-tag.sh

  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-release-tag
    runs-on: ubuntu-24.04
    environment: edit-atlas-release
    permissions:
      contents: write

    steps:
      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release_is_draft="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft \
              2>/dev/null
          )"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published." >&2
              exit 1
            fi
            echo "Resuming draft release $GITHUB_REF_NAME."
          else
            release_version="${GITHUB_REF_NAME#v}"
            qt_source_url="https://github.com/$GITHUB_REPOSITORY/releases"
            qt_source_url+="/download/$GITHUB_REF_NAME"
            qt_source_url+="/edit-atlas-$release_version-qt-source.tar.xz"
            qt_source_notes="Qt corresponding source and LGPL replacement"
            qt_source_notes+=" instructions: $qt_source_url"
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Edit Atlas $GITHUB_REF_NAME" \
              --notes "$qt_source_notes" \
              --generate-notes
          fi

  prepare-qt-source:
    name: Prepare Qt corresponding source
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Prepare Qt corresponding source archive
        run: >-
          ./scripts/ci/prepare-qt-source-archive.sh
          "$GITHUB_REF_NAME"
          build/qt-source

      - name: Upload Qt corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-qt-source
          path: build/qt-source
          if-no-files-found: error
          retention-days: 3

  # Each triplet restores, populates, and consumes its package feed on one runner.
  build-and-package:
    name: Build and package / ${{ matrix.name }}
    needs:
      - validate-release-tag
      - create-release
    if: >-
      always() &&
      (!startsWith(github.ref, 'refs/tags/v') ||
      (needs['validate-release-tag'].result == 'success' &&
      needs['create-release'].result == 'success'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    # Serialize publication for each triplet while allowing different
    # triplets to run concurrently.
    concurrency:
      group: vcpkg-cache-${{ matrix.os }}-${{ matrix.triplet }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            triplet: x64-linux
            debug_preset: debug-x64-linux
            release_preset: release-x64-linux
            package_preset: package-release-x64-linux
            executable_suffix: src/app/edit-atlas
            staged_executable_suffix: bin/edit-atlas
          - name: macOS ARM64
            os: macos-15
            triplet: arm64-osx
            debug_preset: debug-arm64-osx
            release_preset: release-arm64-osx
            executable_suffix: src/app/edit-atlas.app/Contents/MacOS/edit-atlas
            staged_executable_suffix: edit-atlas.app/Contents/MacOS/edit-atlas
          - name: macOS x64
            os: macos-15-intel
            triplet: x64-osx
            debug_preset: debug-x64-osx
            release_preset: release-x64-osx
            executable_suffix: src/app/edit-atlas.app/Contents/MacOS/edit-atlas
            staged_executable_suffix: edit-atlas.app/Contents/MacOS/edit-atlas
          - name: Windows x64
            os: windows-2022
            triplet: x64-windows
            debug_preset: debug-x64-windows
            release_preset: release-x64-windows
            package_preset: package-release-x64-windows
            executable_suffix: src/app/edit-atlas.exe
            staged_executable_suffix: bin/edit-atlas.exe

    env:
      FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite
      VCPKG_DISABLE_METRICS: 1
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
      VCPKG_USERNAME: ${{ github.repository_owner }}
      X_VCPKG_NUGET_ID_PREFIX: edit-atlas-

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          df --human-readable /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/dotnet
          df --human-readable /

      - name: Install Ubuntu host dependencies
        if: runner.os == 'Linux'
        run: ./scripts/ci/install-ubuntu-dependencies.sh

      - name: Install macOS host dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: ./scripts/ci/install-macos-dependencies.sh

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.4.0

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure GitHub Packages NuGet source
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $nuget = (& $env:VCPKG_EXE fetch nuget | Select-Object -Last 1).Trim()
          & $nuget sources add `
            -Source $env:FEED_URL `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName $env:VCPKG_USERNAME `
            -Password $env:GITHUB_TOKEN
          & $nuget setapikey $env:GITHUB_TOKEN -Source $env:FEED_URL

      - name: Configure GitHub Packages NuGet source
        if: runner.os != 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nuget_path="$("$VCPKG_EXE" fetch nuget | tail -n 1)"
          mono "$nuget_path" sources add \
            -Source "$FEED_URL" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "$VCPKG_USERNAME" \
            -Password "$GITHUB_TOKEN"
          mono "$nuget_path" setapikey "$GITHUB_TOKEN" -Source "$FEED_URL"

      - name: Configure Debug
        id: configure
        run: cmake --preset ${{ matrix.debug_preset }}

      - name: Report vcpkg binary package activity
        if: always()
        shell: pwsh
        run: >-
          ./scripts/ci/report-vcpkg-install.ps1
          -BuildDirectory "${{ github.workspace }}/build/${{ matrix.debug_preset }}"

      - name: Clean vcpkg temporary directories
        run: |
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/buildtrees"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/downloads"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/packages"

      - name: Build Debug
        run: cmake --build --preset ${{ matrix.debug_preset }}

      - name: Verify Debug Qt linkage
        run: >-
          cmake
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/${{ matrix.debug_preset }}/${{ matrix.executable_suffix }}"
          -P cmake/VerifyDynamicQtBinary.cmake

      - name: Test Debug
        run: ctest --preset ${{ matrix.debug_preset }}

      - name: Remove Debug build tree
        run: cmake -E remove_directory "build/${{ matrix.debug_preset }}"

      - name: Configure Release
        run: cmake --preset ${{ matrix.release_preset }}

      - name: Clean vcpkg temporary directories
        run: |
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/buildtrees"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/downloads"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/packages"

      - name: Build Release
        run: cmake --build --preset ${{ matrix.release_preset }}

      - name: Verify Release Qt linkage
        run: >-
          cmake
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/${{ matrix.release_preset }}/${{ matrix.executable_suffix }}"
          -P cmake/VerifyDynamicQtBinary.cmake

      - name: Test Release
        run: ctest --preset ${{ matrix.release_preset }}

      - name: Stage Release
        run: >-
          cmake
          --install "build/${{ matrix.release_preset }}"
          --prefix "${{ github.workspace }}/build/stage-${{ matrix.triplet }}"

      - name: Verify staged Qt deployment
        run: >-
          cmake
          "-DEDIT_ATLAS_DEPLOYMENT_ROOT=${{ github.workspace }}/build/stage-${{ matrix.triplet }}"
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/stage-${{ matrix.triplet }}/${{ matrix.staged_executable_suffix }}"
          -P cmake/VerifyApplicationDeployment.cmake

      - name: Archive staged macOS bundle
        if: runner.os == 'macOS'
        run: |
          cmake -E chdir "build/stage-${{ matrix.triplet }}" \
            cmake -E tar czf \
            "${{ github.workspace }}/build/edit-atlas-${{ matrix.triplet }}-stage.tar.gz" \
            --format=gnutar \
            edit-atlas.app

      - name: Upload staged macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-${{ matrix.triplet }}-stage
          path: build/edit-atlas-${{ matrix.triplet }}-stage.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Remove staged Release
        run: cmake -E remove_directory "build/stage-${{ matrix.triplet }}"

      - name: Package Release
        id: package
        if: runner.os != 'macOS'
        run: cpack --preset ${{ matrix.package_preset }}

      - name: Remove CPack temporary files
        if: runner.os != 'macOS'
        run: >-
          cmake -E remove_directory
          "build/packages/${{ matrix.triplet }}/_CPack_Packages"

      - name: Upload packages
        if: >-
          always() &&
          runner.os != 'macOS' &&
          steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-${{ matrix.triplet }}-packages
          path: build/packages/${{ matrix.triplet }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload configuration logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-configuration-logs
          path: |
            build/*/CMakeFiles/CMakeConfigureLog.yaml
            build/*/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean vcpkg temporary directories
        if: always()
        run: |
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/buildtrees"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/downloads"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/packages"

  package-macos-universal:
    name: Package / macOS Universal
    needs: build-and-package
    if: always() && needs['build-and-package'].result == 'success'
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.0

      - name: Download ARM64 staged bundle
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-arm64-osx-stage
          path: build/stages/arm64

      - name: Download x64 staged bundle
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-x64-osx-stage
          path: build/stages/x64

      - name: Create universal package
        run: >-
          ./scripts/ci/create-macos-universal-package.sh
          build/stages/arm64/edit-atlas-arm64-osx-stage.tar.gz
          build/stages/x64/edit-atlas-x64-osx-stage.tar.gz
          build/packages/universal-osx

      - name: Upload universal package
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-universal-osx-packages
          path: build/packages/universal-osx
          if-no-files-found: error
          retention-days: 3

  verify-linux-packages:
    name: Verify Linux packages / ${{ matrix.name }}
    needs: build-and-package
    if: always() && needs['build-and-package'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            distribution: ubuntu
            container: ubuntu:24.04
          - name: Fedora 44
            distribution: fedora
            container: fedora:44

    steps:
      - name: Install Ubuntu verification tools
        if: matrix.distribution == 'ubuntu'
        run: >-
          apt-get update &&
          apt-get install
          --yes
          --no-install-recommends
          binutils
          ca-certificates
          cmake
          findutils
          git

      - name: Install Fedora verification tools
        if: matrix.distribution == 'fedora'
        run: >-
          dnf install
          --assumeyes
          binutils
          ca-certificates
          cmake
          cpio
          findutils
          git
          rpm

      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-x64-linux-packages
          path: build/packages/x64-linux

      - name: Verify packages
        shell: bash
        run: >-
          ./scripts/ci/verify-linux-packages.sh
          ${{ matrix.distribution }}
          build/packages/x64-linux

  verify-macos-package:
    name: Verify macOS package / ${{ matrix.name }}
    needs: package-macos-universal
    if: always() && needs['package-macos-universal'].result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            os: macos-15
          - name: Intel
            os: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.0

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-universal-osx-packages
          path: build/packages/universal-osx

      - name: Verify package
        run: ./scripts/ci/verify-macos-package.sh build/packages/universal-osx

  verify-windows-package:
    name: Verify Windows package / Windows x64
    needs: build-and-package
    if: always() && needs['build-and-package'].result == 'success'
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.0

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-x64-windows-packages
          path: build/packages/x64-windows

      - name: Verify package
        shell: pwsh
        run: >-
          ./scripts/ci/verify-windows-package.ps1
          -PackageDirectory build/packages/x64-windows

      - name: Upload Windows Installer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-logs
          path: build/package-check-windows/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    name: Publish release assets
    if: >-
      always() &&
      needs['create-release'].result == 'success' &&
      needs['prepare-qt-source'].result == 'success' &&
      needs['verify-linux-packages'].result == 'success' &&
      needs['verify-macos-package'].result == 'success' &&
      needs['verify-windows-package'].result == 'success'
    needs:
      - create-release
      - prepare-qt-source
      - verify-linux-packages
      - verify-macos-package
      - verify-windows-package
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: edit-atlas-*-packages
          path: build/release-artifacts
          merge-multiple: true

      - name: Download Qt corresponding source
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-qt-source
          path: build/release-artifacts

      - name: Prepare release assets
        run: >-
          ./scripts/ci/prepare-release-assets.sh
          build/release-artifacts
          build/release-assets

      - name: Upload assets and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          build/release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --clobber
          && gh release edit "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --draft=false

      - name: Publish versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run documentation.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF_NAME"
          --field "version=$GITHUB_REF_NAME"

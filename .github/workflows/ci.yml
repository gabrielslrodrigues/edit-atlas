name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each triplet restores, populates, and consumes its cache on one runner.
  build-and-package:
    name: Build and package / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    # GitHub applies concurrency to whole jobs, so serialize the complete
    # restore/populate/consume lifecycle for each triplet.
    concurrency:
      group: vcpkg-cache-${{ matrix.os }}-${{ matrix.triplet }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            triplet: x64-linux
            cache_target_triplet_file: vcpkg-triplets/x64-linux.cmake
            cache_host_triplet_file: vcpkg-triplets/x64-linux.cmake
            cache_support_file: vcpkg-triplets/x64-linux.cmake
            cache_host_dependencies_file: scripts/ci/install-ubuntu-dependencies.sh
            debug_preset: debug-x64-linux
            release_preset: release-x64-linux
            package_preset: package-release-x64-linux
            executable_suffix: src/app/edit-atlas
            staged_executable_suffix: bin/edit-atlas
          - name: macOS ARM64
            os: macos-15
            triplet: arm64-osx
            cache_target_triplet_file: vcpkg-triplets/arm64-osx.cmake
            cache_host_triplet_file: vcpkg-triplets/arm64-osx.cmake
            cache_support_file: cmake/EditAtlasPlatformSupport.cmake
            cache_host_dependencies_file: scripts/ci/install-macos-dependencies.sh
            debug_preset: debug-arm64-osx
            release_preset: release-arm64-osx
            executable_suffix: src/app/edit-atlas.app/Contents/MacOS/edit-atlas
            staged_executable_suffix: edit-atlas.app/Contents/MacOS/edit-atlas
          - name: macOS x64
            os: macos-15-intel
            triplet: x64-osx
            cache_target_triplet_file: vcpkg-triplets/x64-osx.cmake
            cache_host_triplet_file: vcpkg-triplets/x64-osx.cmake
            cache_support_file: cmake/EditAtlasPlatformSupport.cmake
            cache_host_dependencies_file: scripts/ci/install-macos-dependencies.sh
            debug_preset: debug-x64-osx
            release_preset: release-x64-osx
            executable_suffix: src/app/edit-atlas.app/Contents/MacOS/edit-atlas
            staged_executable_suffix: edit-atlas.app/Contents/MacOS/edit-atlas
          - name: Windows x64
            os: windows-2022
            triplet: x64-windows
            cache_target_triplet_file: vcpkg-triplets/x64-windows.cmake
            cache_host_triplet_file: vcpkg-triplets/x64-windows.cmake
            cache_support_file: vcpkg-triplets/x64-windows.cmake
            cache_host_dependencies_file: vcpkg-triplets/x64-windows.cmake
            debug_preset: debug-x64-windows
            release_preset: release-x64-windows
            package_preset: package-release-x64-windows
            executable_suffix: src/app/edit-atlas.exe
            staged_executable_suffix: bin/edit-atlas.exe

    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite
      VCPKG_DISABLE_METRICS: 1

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          df --human-readable /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/dotnet
          df --human-readable /

      - name: Install Ubuntu host dependencies
        if: runner.os == 'Linux'
        run: ./scripts/ci/install-ubuntu-dependencies.sh

      - name: Install macOS host dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: ./scripts/ci/install-macos-dependencies.sh

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.4.0

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Calculate vcpkg cache context
        id: vcpkg-context
        shell: pwsh
        env:
          VCPKG_DEPENDENCY_HASH: >-
            ${{ hashFiles(
              'CMakePresets.json',
              'vcpkg.json',
              'vcpkg-configuration.json',
              'vcpkg-overlays/**',
              matrix.cache_target_triplet_file,
              matrix.cache_host_triplet_file,
              matrix.cache_support_file,
              matrix.cache_host_dependencies_file
            ) }}
        run: >-
          ./scripts/ci/get-vcpkg-cache-context.ps1
          -Triplet "${{ matrix.triplet }}"
          -DependencyHash "$env:VCPKG_DEPENDENCY_HASH"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/vcpkg/archives
          # Actions caches are immutable. Every writer publishes a new
          # generation after augmenting the restored archive collection.
          key: ${{ steps.vcpkg-context.outputs.key-prefix }}-complete-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.vcpkg-context.outputs.key-prefix }}-complete-
            ${{ steps.vcpkg-context.outputs.key-prefix }}-partial-
            ${{ steps.vcpkg-context.outputs.compatibility-prefix }}-
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-

      - name: Report vcpkg binary cache restore
        shell: pwsh
        env:
          VCPKG_CACHE_MATCHED_KEY: ${{ steps.vcpkg-cache.outputs.cache-matched-key }}
          VCPKG_CACHE_PRIMARY_KEY: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
        run: >-
          ./scripts/ci/report-vcpkg-cache.ps1
          -RequestedKey "$env:VCPKG_CACHE_PRIMARY_KEY"
          -MatchedKey "$env:VCPKG_CACHE_MATCHED_KEY"

      - name: Inventory restored vcpkg binary cache
        id: vcpkg-inventory-before
        shell: pwsh
        run: >-
          ./scripts/ci/get-vcpkg-cache-inventory.ps1
          -CacheDirectory "${{ github.workspace }}/.cache/vcpkg/archives"

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure Debug
        id: configure
        run: cmake --preset ${{ matrix.debug_preset }}

      - name: Report vcpkg binary package activity
        if: always()
        shell: pwsh
        run: >-
          ./scripts/ci/report-vcpkg-install.ps1
          -BuildDirectory "${{ github.workspace }}/build/${{ matrix.debug_preset }}"

      - name: Inventory populated vcpkg binary cache
        id: vcpkg-inventory-after
        if: always()
        shell: pwsh
        run: >-
          ./scripts/ci/get-vcpkg-cache-inventory.ps1
          -CacheDirectory "${{ github.workspace }}/.cache/vcpkg/archives"
          -BeforeFingerprint "${{ steps.vcpkg-inventory-before.outputs.fingerprint }}"

      - name: Save completed vcpkg binary cache
        id: vcpkg-cache-save
        if: >-
          steps.configure.outcome == 'success' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          ) &&
          (
            steps.vcpkg-inventory-after.outputs.changed == 'true' ||
            (
              github.event_name != 'pull_request' &&
              !startsWith(
                steps.vcpkg-cache.outputs.cache-matched-key,
                format(
                  '{0}-complete-',
                  steps.vcpkg-context.outputs.key-prefix
                )
              )
            )
          )
        uses: actions/cache/save@v6.1.0
        with:
          path: .cache/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save partial vcpkg binary cache
        if: >-
          failure() &&
          steps.configure.outcome == 'failure' &&
          steps.vcpkg-inventory-after.outputs.changed == 'true' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: actions/cache/save@v6.1.0
        with:
          path: .cache/vcpkg/archives
          key: ${{ steps.vcpkg-context.outputs.key-prefix }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete superseded vcpkg cache
        if: steps.vcpkg-cache-save.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/ci/remove-superseded-vcpkg-cache.ps1
          -Repository "$env:GITHUB_REPOSITORY"
          -Ref "$env:GITHUB_REF"
          -CurrentKey "${{ steps.vcpkg-cache.outputs.cache-primary-key }}"
          -KeyPrefix
          "vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-",
          "vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-"

      - name: Clean vcpkg temporary directories
        run: |
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/buildtrees"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/downloads"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/packages"

      - name: Build Debug
        run: cmake --build --preset ${{ matrix.debug_preset }}

      - name: Verify Debug Qt linkage
        run: >-
          cmake
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/${{ matrix.debug_preset }}/${{ matrix.executable_suffix }}"
          -P cmake/VerifyDynamicQtBinary.cmake

      - name: Test Debug
        run: ctest --preset ${{ matrix.debug_preset }}

      - name: Remove Debug build tree
        run: cmake -E remove_directory "build/${{ matrix.debug_preset }}"

      - name: Configure Release
        run: cmake --preset ${{ matrix.release_preset }}

      - name: Clean vcpkg temporary directories
        run: |
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/buildtrees"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/downloads"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/packages"

      - name: Build Release
        run: cmake --build --preset ${{ matrix.release_preset }}

      - name: Verify Release Qt linkage
        run: >-
          cmake
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/${{ matrix.release_preset }}/${{ matrix.executable_suffix }}"
          -P cmake/VerifyDynamicQtBinary.cmake

      - name: Test Release
        run: ctest --preset ${{ matrix.release_preset }}

      - name: Stage Release
        run: >-
          cmake
          --install "build/${{ matrix.release_preset }}"
          --prefix "${{ github.workspace }}/build/stage-${{ matrix.triplet }}"

      - name: Verify staged Qt deployment
        run: >-
          cmake
          "-DEDIT_ATLAS_DEPLOYMENT_ROOT=${{ github.workspace }}/build/stage-${{ matrix.triplet }}"
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/stage-${{ matrix.triplet }}/${{ matrix.staged_executable_suffix }}"
          -P cmake/VerifyQtDeployment.cmake

      - name: Archive staged macOS bundle
        if: runner.os == 'macOS'
        run: |
          cmake -E chdir "build/stage-${{ matrix.triplet }}" \
            cmake -E tar czf \
            "${{ github.workspace }}/build/edit-atlas-${{ matrix.triplet }}-stage.tar.gz" \
            --format=gnutar \
            edit-atlas.app

      - name: Upload staged macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-${{ matrix.triplet }}-stage
          path: build/edit-atlas-${{ matrix.triplet }}-stage.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Remove staged Release
        run: cmake -E remove_directory "build/stage-${{ matrix.triplet }}"

      - name: Package Release
        id: package
        if: runner.os != 'macOS'
        run: cpack --preset ${{ matrix.package_preset }}

      - name: Remove CPack temporary files
        if: runner.os != 'macOS'
        run: >-
          cmake -E remove_directory
          "build/packages/${{ matrix.triplet }}/_CPack_Packages"

      - name: Upload packages
        if: >-
          always() &&
          runner.os != 'macOS' &&
          steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-${{ matrix.triplet }}-packages
          path: build/packages/${{ matrix.triplet }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload configuration logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-configuration-logs
          path: |
            build/*/CMakeFiles/CMakeConfigureLog.yaml
            build/*/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean vcpkg temporary directories
        if: always()
        run: |
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/buildtrees"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/downloads"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/packages"

  package-macos-universal:
    name: Package / macOS Universal
    needs: build-and-package
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.0

      - name: Download ARM64 staged bundle
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-arm64-osx-stage
          path: build/stages/arm64

      - name: Download x64 staged bundle
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-x64-osx-stage
          path: build/stages/x64

      - name: Create universal package
        run: >-
          ./scripts/ci/create-macos-universal-package.sh
          build/stages/arm64/edit-atlas-arm64-osx-stage.tar.gz
          build/stages/x64/edit-atlas-x64-osx-stage.tar.gz
          build/packages/universal-osx

      - name: Upload universal package
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-universal-osx-packages
          path: build/packages/universal-osx
          if-no-files-found: error
          retention-days: 3

  verify-linux-packages:
    name: Verify Linux packages / ${{ matrix.name }}
    needs: build-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            distribution: ubuntu
            container: ubuntu:24.04
          - name: Fedora 44
            distribution: fedora
            container: fedora:44

    steps:
      - name: Install Ubuntu verification tools
        if: matrix.distribution == 'ubuntu'
        run: >-
          apt-get update &&
          apt-get install
          --yes
          --no-install-recommends
          binutils
          ca-certificates
          cmake
          findutils
          git

      - name: Install Fedora verification tools
        if: matrix.distribution == 'fedora'
        run: >-
          dnf install
          --assumeyes
          binutils
          ca-certificates
          cmake
          cpio
          findutils
          git
          rpm

      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-x64-linux-packages
          path: build/packages/x64-linux

      - name: Verify packages
        shell: bash
        run: >-
          ./scripts/ci/verify-linux-packages.sh
          ${{ matrix.distribution }}
          build/packages/x64-linux

  verify-macos-package:
    name: Verify macOS package / ${{ matrix.name }}
    needs: package-macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            os: macos-15
          - name: Intel
            os: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.0

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-universal-osx-packages
          path: build/packages/universal-osx

      - name: Verify package
        run: ./scripts/ci/verify-macos-package.sh build/packages/universal-osx

  verify-windows-package:
    name: Verify Windows package / Windows x64
    needs: build-and-package
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.0

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-x64-windows-packages
          path: build/packages/x64-windows

      - name: Verify package
        shell: pwsh
        run: >-
          ./scripts/ci/verify-windows-package.ps1
          -PackageDirectory build/packages/x64-windows

      - name: Upload Windows Installer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-logs
          path: build/package-check-windows/*.log
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Each kind of trigger gets its own lane, so superseding still works within a
# lane while unrelated runs stop shooting each other: a merge to master used
# to cancel a nightly in flight, which is how a tracking issue outlived the
# run that would have closed it, and a deliberate dispatch used to cancel the
# merge-path run for the same commit.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which frontend ships is a build option, so CI derives it instead of
  # assuming it. Everything else in the supported list is exercised on the
  # schedule, however many there are, which keeps any frontend from being
  # tested twice in one run when the default changes.
  frontends:
    name: Resolve frontends
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      production: ${{ steps.resolve.outputs.production }}
      others: ${{ steps.resolve.outputs.others }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Resolve the production frontend and the others
        id: resolve
        run: ./scripts/ci/resolve-frontends.sh "$GITHUB_OUTPUT"

  packages:
    name: Build and package
    uses: ./.github/workflows/build-and-package.yml
    permissions:
      actions: write
      contents: read
      packages: write

  package-verification:
    name: Verify packages
    needs: packages
    if: always() && needs.packages.result == 'success'
    uses: ./.github/workflows/package-verification.yml
    permissions:
      contents: read

  packaged-e2e:
    name: Packaged E2E
    needs:
      - frontends
      - packages
    if: always() && needs.packages.result == 'success'
    uses: ./.github/workflows/packaged-e2e.yml
    with:
      frontend: ${{ needs.frontends.outputs.production }}
    permissions:
      contents: read
      packages: read

  # Every frontend production does not ship is verified wherever the one it
  # does ship is, and the gate requires it just the same: a frontend the
  # project still supports is not one to hear about a day late. The packages
  # both suites need are built on every run regardless, and these jobs run
  # beside the production frontend's rather than after them, so the merge path
  # pays no build cost and almost no wall clock.
  packaged-e2e-others:
    name: Packaged E2E (${{ matrix.frontend }})
    needs:
      - frontends
      - packages
    if: >-
      always() && needs.packages.result == 'success' &&
      needs.frontends.outputs.others != '[]'
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJSON(needs.frontends.outputs.others) }}
    uses: ./.github/workflows/packaged-e2e.yml
    with:
      frontend: ${{ matrix.frontend }}
    permissions:
      contents: read
      packages: read

  gate:
    # The single context `master` requires. Adding a job that must pass before
    # a merge means adding it here, not editing the branch ruleset. Artifact
    # cleanup is deliberately absent: it is housekeeping that runs even when
    # validation fails, and it reports no quality signal.
    name: CI gate
    needs:
      - packages
      - package-verification
      - packaged-e2e
      - packaged-e2e-others
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}

    steps:
      - name: Require every gated workflow to succeed
        env:
          GATED_RESULTS: ${{ toJSON(needs) }}
          # A supported list holding only the frontend production ships skips
          # the other suite, which is not a failure. Any other reason it skips
          # is a failure of the packages it needs, and those are gated here in
          # their own right.
          ACCEPTABLY_SKIPPED: packaged-e2e-others
        run: |
          set -euo pipefail
          python3 - <<'GATE'
          import json
          import os
          import sys

          results = json.loads(os.environ["GATED_RESULTS"])
          if not results:
              sys.exit("::error::the gate resolved no dependency results")

          acceptably_skipped = set(
              os.environ.get("ACCEPTABLY_SKIPPED", "").split()
          )

          unsuccessful = []
          for job, outcome in sorted(results.items()):
              result = outcome.get("result") or "no result"
              print(f"{job}: {result}")
              if result == "success":
                  continue
              if result == "skipped" and job in acceptably_skipped:
                  continue
              unsuccessful.append(job)

          if unsuccessful:
              names = ", ".join(unsuccessful)
              sys.exit(f"::error::gated workflows did not succeed: {names}")
          GATE

  cleanup-artifacts:
    name: Remove transient workflow artifacts
    needs:
      - packages
      - package-verification
      - packaged-e2e
      - packaged-e2e-others
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Delete transfer artifacts
        uses: ./.github/actions/delete-workflow-artifacts
        with:
          pattern: >-
            ^(?:[a-z]+-frontend-.*-(packages|stage)|edit-atlas-e2e-media-fixtures)$

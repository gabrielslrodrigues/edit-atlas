name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-tag:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        run: ./scripts/ci/validate-release-tag.sh

  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-release-tag
    runs-on: ubuntu-24.04
    environment: edit-atlas-release
    permissions:
      contents: write

    steps:
      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release_is_draft="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft \
              2>/dev/null
          )"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published." >&2
              exit 1
            fi
            echo "Resuming draft release $GITHUB_REF_NAME."
          else
            release_version="${GITHUB_REF_NAME#v}"
            qt_source_url="https://github.com/$GITHUB_REPOSITORY/releases"
            qt_source_url+="/download/$GITHUB_REF_NAME"
            qt_source_url+="/edit-atlas-$release_version-qt-source.tar.xz"
            qt_source_notes="Qt corresponding source and LGPL replacement"
            qt_source_notes+=" instructions: $qt_source_url"
            ffmpeg_source_url="https://github.com/$GITHUB_REPOSITORY/releases"
            ffmpeg_source_url+="/download/$GITHUB_REF_NAME"
            ffmpeg_source_url+="/edit-atlas-$release_version-ffmpeg-source.tar.xz"
            ffmpeg_source_notes="FFmpeg corresponding source and LGPL"
            ffmpeg_source_notes+=" replacement instructions: $ffmpeg_source_url"
            release_notes="$qt_source_notes"
            release_notes+=$'\n\n'
            release_notes+="$ffmpeg_source_notes"
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Edit Atlas $GITHUB_REF_NAME" \
              --notes "$release_notes" \
              --generate-notes
          fi

  prepare-qt-source:
    name: Prepare Qt corresponding source
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Prepare Qt corresponding source archive
        run: >-
          ./scripts/ci/prepare-qt-source-archive.sh
          "$GITHUB_REF_NAME"
          build/qt-source

      - name: Upload Qt corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-qt-source
          path: build/qt-source
          if-no-files-found: error
          retention-days: 3

  prepare-ffmpeg-source:
    name: Prepare FFmpeg corresponding source
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Prepare FFmpeg corresponding source archive
        run: >-
          ./scripts/ci/prepare-ffmpeg-source-archive.sh
          "$GITHUB_REF_NAME"
          build/ffmpeg-source

      - name: Upload FFmpeg corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-ffmpeg-source
          path: build/ffmpeg-source
          if-no-files-found: error
          retention-days: 3

  # Each triplet restores, populates, and consumes its package feed on one runner.
  build-and-package:
    name: Build and package / ${{ matrix.name }}
    needs:
      - validate-release-tag
      - create-release
    if: >-
      always() &&
      (!startsWith(github.ref, 'refs/tags/v') ||
      (needs['validate-release-tag'].result == 'success' &&
      needs['create-release'].result == 'success'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    # Serialize publication for each triplet while allowing different
    # triplets to run concurrently.
    concurrency:
      group: vcpkg-cache-${{ matrix.os }}-${{ matrix.triplet }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            source_dir: .
            triplet: x64-linux
            debug_preset: debug-x64-linux
            widgets_release_preset: release-widgets-x64-linux
            quick_release_preset: release-quick-x64-linux
            package_generators: 'TGZ;DEB;RPM'
            selected_frontend_executable_suffix: edit-atlas
            widgets_debug_executable_suffix: edit-atlas
            quick_debug_executable_suffix: edit-atlas-quick
            staged_executable_suffix: bin/edit-atlas
          - name: macOS ARM64
            os: macos-15
            source_dir: .
            triplet: arm64-osx
            debug_preset: debug-arm64-osx
            widgets_release_preset: release-widgets-arm64-osx
            quick_release_preset: release-quick-arm64-osx
            selected_frontend_executable_suffix: edit-atlas.app/Contents/MacOS/edit-atlas
            widgets_debug_executable_suffix: edit-atlas.app/Contents/MacOS/edit-atlas
            quick_debug_executable_suffix: edit-atlas-quick
            staged_executable_suffix: edit-atlas.app/Contents/MacOS/edit-atlas
          - name: macOS x64
            os: macos-15-intel
            source_dir: .
            triplet: x64-osx
            debug_preset: debug-x64-osx
            widgets_release_preset: release-widgets-x64-osx
            quick_release_preset: release-quick-x64-osx
            selected_frontend_executable_suffix: edit-atlas.app/Contents/MacOS/edit-atlas
            widgets_debug_executable_suffix: edit-atlas.app/Contents/MacOS/edit-atlas
            quick_debug_executable_suffix: edit-atlas-quick
            staged_executable_suffix: edit-atlas.app/Contents/MacOS/edit-atlas
          - name: Windows x64
            os: windows-2022
            source_dir: V:/
            triplet: x64-windows
            debug_preset: debug-x64-windows
            widgets_release_preset: release-widgets-x64-windows
            quick_release_preset: release-quick-x64-windows
            package_generators: WIX
            selected_frontend_executable_suffix: edit-atlas.exe
            widgets_debug_executable_suffix: edit-atlas.exe
            quick_debug_executable_suffix: edit-atlas-quick.exe
            staged_executable_suffix: bin/edit-atlas.exe

    env:
      FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite
      VCPKG_DISABLE_METRICS: 1
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
      VCPKG_USERNAME: ${{ github.repository_owner }}
      X_VCPKG_NUGET_ID_PREFIX: edit-atlas-

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Shorten Windows workspace path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          subst V: "${{ github.workspace }}"

      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          df --human-readable /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/dotnet
          df --human-readable /

      - name: Install Ubuntu host dependencies
        if: runner.os == 'Linux'
        run: ./scripts/ci/install-ubuntu-dependencies.sh

      - name: Install macOS host dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: ./scripts/ci/install-macos-dependencies.sh

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.4.0

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure GitHub Packages NuGet source
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $nuget = (& $env:VCPKG_EXE fetch nuget | Select-Object -Last 1).Trim()
          & $nuget sources add `
            -Source $env:FEED_URL `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName $env:VCPKG_USERNAME `
            -Password $env:GITHUB_TOKEN
          & $nuget setapikey $env:GITHUB_TOKEN -Source $env:FEED_URL

      - name: Configure GitHub Packages NuGet source
        if: runner.os != 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nuget_path="$("$VCPKG_EXE" fetch nuget | tail -n 1)"
          mono "$nuget_path" sources add \
            -Source "$FEED_URL" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "$VCPKG_USERNAME" \
            -Password "$GITHUB_TOKEN"
          mono "$nuget_path" setapikey "$GITHUB_TOKEN" -Source "$FEED_URL"

      - name: Configure Debug
        id: configure
        run: >-
          cmake -S "${{ matrix.source_dir }}"
          --preset ${{ matrix.debug_preset }}
          -DEDIT_ATLAS_DEFAULT_FRONTEND=widgets

      - name: Report vcpkg binary package activity
        if: always()
        shell: pwsh
        run: >-
          ./scripts/ci/report-vcpkg-install.ps1
          -BuildDirectory "${{ github.workspace }}/build/${{ matrix.debug_preset }}"

      - name: Clean vcpkg temporary directories
        run: |
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/buildtrees"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/downloads"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/packages"

      - name: Build Debug
        run: cmake --build --preset ${{ matrix.debug_preset }}

      - name: Lint Qt Quick QML
        if: runner.os == 'Linux'
        run: >-
          cmake --build --preset ${{ matrix.debug_preset }}
          --target all_qmllint

      - name: Verify Widgets Debug Qt linkage
        run: >-
          cmake
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/${{ matrix.debug_preset }}/src/frontends/widgets/${{ matrix.widgets_debug_executable_suffix }}"
          -DEDIT_ATLAS_EXPECTED_FRONTEND=widgets
          -P cmake/VerifyDynamicQtBinary.cmake

      - name: Verify Quick Debug Qt linkage
        run: >-
          cmake
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/${{ matrix.debug_preset }}/src/frontends/quick/${{ matrix.quick_debug_executable_suffix }}"
          -DEDIT_ATLAS_EXPECTED_FRONTEND=quick
          -P cmake/VerifyDynamicQtBinary.cmake

      - name: Test Debug
        run: ctest --preset ${{ matrix.debug_preset }}

      - name: Remove Debug build tree
        run: cmake -E remove_directory "build/${{ matrix.debug_preset }}"

      - name: Configure Widgets Release
        run: >-
          cmake -S "${{ matrix.source_dir }}"
          --preset ${{ matrix.widgets_release_preset }}

      - name: Clean vcpkg temporary directories
        run: |
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/buildtrees"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/downloads"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/packages"

      - name: Build Widgets Release
        run: cmake --build --preset ${{ matrix.widgets_release_preset }}

      - name: Verify Widgets Release Qt linkage
        run: >-
          cmake
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/${{ matrix.widgets_release_preset }}/src/frontends/widgets/${{ matrix.selected_frontend_executable_suffix }}"
          -DEDIT_ATLAS_EXPECTED_FRONTEND=widgets
          -P cmake/VerifyDynamicQtBinary.cmake

      - name: Test Widgets Release
        run: ctest --preset ${{ matrix.widgets_release_preset }}

      - name: Restore rendered-video E2E fixture cache
        if: runner.os == 'Linux'
        id: rendered-video-fixture-cache
        uses: actions/cache/restore@v6
        with:
          path: build/e2e-media-fixtures
          key: >-
            rendered-video-e2e-v1-${{ hashFiles(
              'tests/integration/media/e2e_fixture_generator.cpp',
              'tests/integration/media/media_fixture.cpp',
              'tests/integration/media/include/edit_atlas/test/media_fixture.hpp',
              'vcpkg.json'
            ) }}

      - name: Prepare rendered-video E2E fixtures
        if: >-
          runner.os == 'Linux' &&
          steps.rendered-video-fixture-cache.outputs.cache-hit != 'true'
        run: >-
          build/${{ matrix.widgets_release_preset }}/tests/integration/media/edit_atlas_e2e_media_fixture_generator
          build/e2e-media-fixtures

      - name: Save rendered-video E2E fixture cache
        if: >-
          runner.os == 'Linux' &&
          steps.rendered-video-fixture-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/e2e-media-fixtures
          key: ${{ steps.rendered-video-fixture-cache.outputs.cache-primary-key }}

      - name: Publish rendered-video E2E fixtures for this workflow
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: edit-atlas-e2e-media-fixtures
          path: build/e2e-media-fixtures
          if-no-files-found: error
          retention-days: 3

      - name: Stage Widgets Release
        run: >-
          cmake
          --install "build/${{ matrix.widgets_release_preset }}"
          --prefix "${{ github.workspace }}/build/stage-widgets-${{ matrix.triplet }}"

      - name: Verify staged Widgets deployment
        run: >-
          cmake
          "-DEDIT_ATLAS_DEPLOYMENT_ROOT=${{ github.workspace }}/build/stage-widgets-${{ matrix.triplet }}"
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/stage-widgets-${{ matrix.triplet }}/${{ matrix.staged_executable_suffix }}"
          -DEDIT_ATLAS_EXPECTED_FRONTEND=widgets
          "-DEDIT_ATLAS_VERIFY_PRIVATE_RUNTIME_BOUNDARY=TRUE"
          -P cmake/VerifyApplicationDeployment.cmake

      - name: Archive staged Widgets macOS bundle
        if: runner.os == 'macOS'
        run: |
          cmake -E chdir "build/stage-widgets-${{ matrix.triplet }}" \
            cmake -E tar czf \
            "${{ github.workspace }}/build/edit-atlas-widgets-${{ matrix.triplet }}-stage.tar.gz" \
            --format=gnutar \
            edit-atlas.app

      - name: Upload staged Widgets macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: widgets-frontend-${{ matrix.triplet }}-stage
          path: build/edit-atlas-widgets-${{ matrix.triplet }}-stage.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Remove staged Widgets Release
        run: >-
          cmake -E remove_directory
          "build/stage-widgets-${{ matrix.triplet }}"

      - name: Package Widgets Release
        id: package_widgets
        if: runner.os != 'macOS'
        run: >-
          cpack
          --config "build/${{ matrix.widgets_release_preset }}/CPackConfig.cmake"
          -G "${{ matrix.package_generators }}"
          -B "build/packages/widgets/${{ matrix.triplet }}"

      - name: Remove Widgets CPack temporary files
        if: runner.os != 'macOS'
        run: >-
          cmake -E remove_directory
          "build/packages/widgets/${{ matrix.triplet }}/_CPack_Packages"

      - name: Upload Widgets packages
        if: >-
          always() &&
          runner.os != 'macOS' &&
          steps.package_widgets.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: widgets-frontend-${{ matrix.triplet }}-packages
          path: build/packages/widgets/${{ matrix.triplet }}
          if-no-files-found: error
          retention-days: 3

      - name: Remove Widgets Release build tree
        run: >-
          cmake -E remove_directory
          "build/${{ matrix.widgets_release_preset }}"

      - name: Configure Quick Release
        run: >-
          cmake -S "${{ matrix.source_dir }}"
          --preset ${{ matrix.quick_release_preset }}

      - name: Build Quick Release
        run: cmake --build --preset ${{ matrix.quick_release_preset }}

      - name: Verify Quick Release Qt linkage
        run: >-
          cmake
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/${{ matrix.quick_release_preset }}/src/frontends/quick/${{ matrix.selected_frontend_executable_suffix }}"
          -DEDIT_ATLAS_EXPECTED_FRONTEND=quick
          -P cmake/VerifyDynamicQtBinary.cmake

      - name: Test Quick Release
        run: ctest --preset ${{ matrix.quick_release_preset }}

      - name: Stage Quick Release
        run: >-
          cmake
          --install "build/${{ matrix.quick_release_preset }}"
          --prefix "${{ github.workspace }}/build/stage-quick-${{ matrix.triplet }}"

      - name: Verify staged Quick deployment
        run: >-
          cmake
          "-DEDIT_ATLAS_DEPLOYMENT_ROOT=${{ github.workspace }}/build/stage-quick-${{ matrix.triplet }}"
          "-DEDIT_ATLAS_EXECUTABLE=${{ github.workspace }}/build/stage-quick-${{ matrix.triplet }}/${{ matrix.staged_executable_suffix }}"
          -DEDIT_ATLAS_EXPECTED_FRONTEND=quick
          -DEDIT_ATLAS_VERIFY_PRIVATE_RUNTIME_BOUNDARY=TRUE
          -P cmake/VerifyApplicationDeployment.cmake

      - name: Archive staged Quick macOS bundle
        if: runner.os == 'macOS'
        run: |
          cmake -E chdir "build/stage-quick-${{ matrix.triplet }}" \
            cmake -E tar czf \
            "${{ github.workspace }}/build/edit-atlas-quick-${{ matrix.triplet }}-stage.tar.gz" \
            --format=gnutar \
            edit-atlas.app

      - name: Upload staged Quick macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: quick-frontend-${{ matrix.triplet }}-stage
          path: build/edit-atlas-quick-${{ matrix.triplet }}-stage.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Remove staged Quick Release
        run: >-
          cmake -E remove_directory
          "build/stage-quick-${{ matrix.triplet }}"

      - name: Package Quick Release
        id: package_quick
        if: runner.os != 'macOS'
        run: >-
          cpack
          --config "build/${{ matrix.quick_release_preset }}/CPackConfig.cmake"
          -G "${{ matrix.package_generators }}"
          -B "build/packages/quick/${{ matrix.triplet }}"

      - name: Remove Quick CPack temporary files
        if: runner.os != 'macOS'
        run: >-
          cmake -E remove_directory
          "build/packages/quick/${{ matrix.triplet }}/_CPack_Packages"

      - name: Upload Quick packages
        if: >-
          always() &&
          runner.os != 'macOS' &&
          steps.package_quick.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: quick-frontend-${{ matrix.triplet }}-packages
          path: build/packages/quick/${{ matrix.triplet }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload build and test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-build-test-diagnostics
          path: |
            build/*/CMakeFiles/CMakeConfigureLog.yaml
            build/*/Testing/Temporary
            build/*/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean vcpkg temporary directories
        if: always()
        run: |
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/buildtrees"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/downloads"
          cmake -E remove_directory "${{ github.workspace }}/vcpkg/packages"

  package-macos-universal:
    name: Package / macOS Universal / ${{ matrix.display_name }}
    needs: build-and-package
    if: always() && needs['build-and-package'].result == 'success'
    runs-on: macos-15
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - frontend: widgets
            display_name: Widgets
          - frontend: quick
            display_name: Quick

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.0

      - name: Download ARM64 staged bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.frontend }}-frontend-arm64-osx-stage
          path: build/stages/${{ matrix.frontend }}-arm64

      - name: Download x64 staged bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.frontend }}-frontend-x64-osx-stage
          path: build/stages/${{ matrix.frontend }}-x64

      - name: Create universal package
        run: >-
          ./scripts/ci/create-macos-universal-package.sh
          build/stages/${{ matrix.frontend }}-arm64/edit-atlas-${{ matrix.frontend }}-arm64-osx-stage.tar.gz
          build/stages/${{ matrix.frontend }}-x64/edit-atlas-${{ matrix.frontend }}-x64-osx-stage.tar.gz
          build/packages/${{ matrix.frontend }}/universal-osx

      - name: Upload universal package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.frontend }}-frontend-universal-osx-packages
          path: build/packages/${{ matrix.frontend }}/universal-osx
          if-no-files-found: error
          retention-days: 3

  verify-linux-packages:
    name: Verify Linux packages / ${{ matrix.check_name }}
    needs: build-and-package
    if: always() && needs['build-and-package'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: Ubuntu 24.04
            distribution: ubuntu
            container: ubuntu:24.04
            artifact: widgets-frontend-x64-linux-packages
            package_path: build/packages/widgets/x64-linux
          - check_name: Fedora 44
            distribution: fedora
            container: fedora:44
            artifact: widgets-frontend-x64-linux-packages
            package_path: build/packages/widgets/x64-linux
          - check_name: Ubuntu 24.04 / Quick
            distribution: ubuntu
            container: ubuntu:24.04
            artifact: quick-frontend-x64-linux-packages
            package_path: build/packages/quick/x64-linux
          - check_name: Fedora 44 / Quick
            distribution: fedora
            container: fedora:44
            artifact: quick-frontend-x64-linux-packages
            package_path: build/packages/quick/x64-linux

    steps:
      - name: Install Ubuntu verification tools
        if: matrix.distribution == 'ubuntu'
        run: >-
          apt-get update &&
          apt-get install
          --yes
          --no-install-recommends
          binutils
          ca-certificates
          cmake
          findutils
          git
          xauth
          xvfb

      - name: Install Fedora verification tools
        if: matrix.distribution == 'fedora'
        run: >-
          dnf install
          --assumeyes
          binutils
          ca-certificates
          cmake
          cpio
          findutils
          git
          rpm
          xorg-x11-server-Xvfb
          xorg-x11-xauth

      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package_path }}

      - name: Verify packages
        shell: bash
        run: >-
          ./scripts/ci/verify-linux-packages.sh
          ${{ matrix.distribution }}
          ${{ matrix.package_path }}

  e2e-linux-package:
    name: E2E / Ubuntu packaged desktop
    needs: build-and-package
    if: always() && needs['build-and-package'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install desktop automation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            at-spi2-core \
            build-essential \
            dbus-x11 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-3.0 \
            libcairo2-dev \
            libgirepository1.0-dev \
            locales \
            pkg-config \
            python3-dev \
            x11-apps \
            xauth \
            xvfb
          sudo locale-gen pt_BR.UTF-8

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: widgets-frontend-x64-linux-packages
          path: build/packages/widgets/x64-linux

      - name: Download rendered-video E2E fixtures
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-e2e-media-fixtures
          path: build/e2e/media-fixtures

      - name: Install generated DEB
        shell: bash
        run: |
          mapfile -t packages < <(find "${GITHUB_WORKSPACE}/build/packages/widgets/x64-linux" -type f -name '*.deb')
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one DEB, found ${#packages[@]}" >&2
            exit 1
          fi
          sudo apt-get install --yes "${packages[0]}"

      - name: Configure Linux crash dumps
        shell: bash
        run: |
          dump_directory="${GITHUB_WORKSPACE}/build/e2e/crash-dumps"
          mkdir -p "$dump_directory"
          cat /proc/sys/kernel/core_pattern >build/e2e/original-core-pattern
          sudo sysctl -w \
            "kernel.core_pattern=${dump_directory}/core.%e.%p.%t"

      - name: Run packaged CLI and desktop E2E tests
        shell: bash
        env:
          GSETTINGS_BACKEND: memory
        run: |
          ulimit -c unlimited
          dbus-run-session -- \
            xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1440x1000x24 -nolisten tcp" \
            tests/e2e/run-linux.sh \
            --app /usr/bin/edit-atlas \
            --cli /usr/bin/edit-atlas-cli

      - name: Upload Linux E2E reports and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-packaged-e2e-results
          path: |
            build/e2e/reports
            build/e2e/artifacts
            build/e2e/crash-dumps
            build/e2e/output
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove installed package
        if: always()
        run: |
          if [[ -f build/e2e/original-core-pattern ]]; then
            sudo sysctl -w \
              "kernel.core_pattern=$(<build/e2e/original-core-pattern)"
          fi
          if dpkg-query --show edit-atlas >/dev/null 2>&1; then
            sudo apt-get remove --yes edit-atlas
          fi

  verify-macos-package:
    name: Verify macOS package / ${{ matrix.check_name }}
    needs: package-macos-universal
    if: always() && needs['package-macos-universal'].result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: Apple Silicon
            os: macos-15
            artifact_suffix: apple-silicon-widgets
            package_artifact: widgets-frontend-universal-osx-packages
            package_path: build/packages/widgets/universal-osx
          - check_name: Intel
            os: macos-15-intel
            artifact_suffix: intel-widgets
            package_artifact: widgets-frontend-universal-osx-packages
            package_path: build/packages/widgets/universal-osx
          - check_name: Apple Silicon / Quick
            os: macos-15
            artifact_suffix: apple-silicon-quick
            package_artifact: quick-frontend-universal-osx-packages
            package_path: build/packages/quick/universal-osx
          - check_name: Intel / Quick
            os: macos-15-intel
            artifact_suffix: intel-quick
            package_artifact: quick-frontend-universal-osx-packages
            package_path: build/packages/quick/universal-osx

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.0

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.package_artifact }}
          path: ${{ matrix.package_path }}

      - name: Mark macOS crash-report window
        run: |
          mkdir -p build/package-check-macos/crash-reports
          touch build/package-check-macos/crash-report-start

      - name: Verify package
        run: >-
          ./scripts/ci/verify-macos-package.sh
          ${{ matrix.package_path }}

      - name: Collect macOS crash reports
        if: always()
        run: |
          ./scripts/ci/collect-macos-crash-reports.sh \
            build/package-check-macos/crash-report-start \
            build/package-check-macos/crash-reports

      - name: Upload macOS crash reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-package-crash-reports-${{ matrix.artifact_suffix }}
          path: build/package-check-macos/crash-reports
          if-no-files-found: ignore
          retention-days: 7

  e2e-macos-package:
    # GitHub-hosted macOS runners cannot grant Accessibility permission to the
    # test process non-interactively. Keep the experimental job visible, but
    # disabled until it can run on a pre-authorized interactive runner.
    name: E2E / macOS packaged desktop (experimental, disabled)
    needs: package-macos-universal
    if: >-
      false &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      needs['package-macos-universal'].result == 'success'
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: widgets-frontend-universal-osx-packages
          path: build/packages/widgets/universal-osx

      - name: Download rendered-video E2E fixtures
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-e2e-media-fixtures
          path: build/e2e/media-fixtures

      - name: Install generated PKG
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("${package}")
          done < <(find build/packages/widgets/universal-osx -type f -name '*.pkg')
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one PKG, found ${#packages[@]}" >&2
            exit 1
          fi
          if [[ -e /Applications/edit-atlas.app ]]; then
            echo "Package target already exists: /Applications/edit-atlas.app" >&2
            exit 1
          fi
          sudo installer -pkg "${packages[0]}" -target /
          package_id="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' \
              /Applications/edit-atlas.app/Contents/Info.plist
          )"
          echo "EDIT_ATLAS_E2E_PACKAGE_ID=${package_id}" >>"${GITHUB_ENV}"

      - name: Mark macOS crash-report window
        run: |
          mkdir -p build/e2e/crash-dumps
          touch build/e2e/crash-report-start

      - name: Run packaged CLI and desktop E2E tests
        run: |
          tests/e2e/run-macos.sh \
            --app /Applications/edit-atlas.app/Contents/MacOS/edit-atlas \
            --cli /Applications/edit-atlas.app/Contents/MacOS/edit-atlas-cli

      - name: Collect macOS crash reports
        if: always()
        run: |
          ./scripts/ci/collect-macos-crash-reports.sh \
            build/e2e/crash-report-start \
            build/e2e/crash-dumps

      - name: Remove installed package and test state
        if: always()
        run: |
          pkill -x edit-atlas || true
          sudo rm -rf /Applications/edit-atlas.app
          if [[ -n "${EDIT_ATLAS_E2E_PACKAGE_ID:-}" ]]; then
            sudo pkgutil --forget "${EDIT_ATLAS_E2E_PACKAGE_ID}" || true
          fi
          rm -rf build/e2e/state

      - name: Upload macOS E2E reports and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-packaged-e2e-results
          path: |
            build/e2e/reports
            build/e2e/artifacts
            build/e2e/crash-dumps
            build/e2e/output
          if-no-files-found: ignore
          retention-days: 7

  verify-windows-package:
    name: Verify Windows package / ${{ matrix.check_name }}
    needs: build-and-package
    if: always() && needs['build-and-package'].result == 'success'
    runs-on: windows-2022
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: Windows x64
            artifact: widgets-frontend-x64-windows-packages
            package_path: build/packages/widgets/x64-windows
            artifact_suffix: widgets
          - check_name: Windows x64 / Quick
            artifact: quick-frontend-x64-windows-packages
            package_path: build/packages/quick/x64-windows
            artifact_suffix: quick

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.0

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package_path }}

      - name: Verify package
        shell: pwsh
        run: >-
          ./scripts/ci/verify-windows-package.ps1
          -PackageDirectory ${{ matrix.package_path }}

      - name: Upload Windows Installer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-logs-${{ matrix.artifact_suffix }}
          path: build/package-check-windows/*.log
          if-no-files-found: ignore
          retention-days: 7

  e2e-windows-package:
    name: E2E / Windows packaged desktop
    needs: build-and-package
    if: always() && needs['build-and-package'].result == 'success'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: widgets-frontend-x64-windows-packages
          path: build/packages/widgets/x64-windows

      - name: Download rendered-video E2E fixtures
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-e2e-media-fixtures
          path: build/e2e/media-fixtures

      - name: Install generated MSI
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem build/packages/widgets/x64-windows `
              -Recurse -File -Filter *.msi
          )
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSI; found $($packages.Count)."
          }
          $installer = $packages[0].FullName
          $installRoot = Join-Path $env:GITHUB_WORKSPACE "build/e2e/install"
          $installLog = Join-Path $env:GITHUB_WORKSPACE "build/e2e/msi-install.log"
          New-Item -ItemType Directory -Force (Split-Path $installLog) | Out-Null
          "EDIT_ATLAS_E2E_MSI=$installer" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EDIT_ATLAS_E2E_INSTALL_ROOT=$installRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $process = Start-Process `
            -FilePath msiexec.exe `
            -ArgumentList @(
              "/i", "`"$installer`"", "/qn", "/norestart", "/L*V",
              "`"$installLog`"", "INSTALL_ROOT=`"$installRoot`""
            ) `
            -PassThru `
            -Wait
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "MSI installation failed with exit code $($process.ExitCode)."
          }

      - name: Configure Windows crash dumps
        shell: pwsh
        run: |
          $dumpDirectory = Join-Path `
            $env:GITHUB_WORKSPACE "build/e2e/crash-dumps"
          New-Item -ItemType Directory -Force $dumpDirectory | Out-Null
          $registryRoot = `
            "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          foreach ($executable in @("edit-atlas.exe", "edit-atlas-cli.exe")) {
            $registryPath = Join-Path $registryRoot $executable
            New-Item -Path $registryPath -Force | Out-Null
            New-ItemProperty `
              -Path $registryPath `
              -Name DumpFolder `
              -PropertyType ExpandString `
              -Value $dumpDirectory `
              -Force | Out-Null
            New-ItemProperty `
              -Path $registryPath `
              -Name DumpType `
              -PropertyType DWord `
              -Value 2 `
              -Force | Out-Null
            New-ItemProperty `
              -Path $registryPath `
              -Name DumpCount `
              -PropertyType DWord `
              -Value 5 `
              -Force | Out-Null
          }

      - name: Run packaged CLI and desktop E2E tests
        shell: pwsh
        run: |
          tests/e2e/run-windows.ps1 `
            -App "$env:EDIT_ATLAS_E2E_INSTALL_ROOT/bin/edit-atlas.exe" `
            -Cli "$env:EDIT_ATLAS_E2E_INSTALL_ROOT/bin/edit-atlas-cli.exe"

      - name: Remove installed package and test state
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name edit-atlas -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          if ($env:EDIT_ATLAS_E2E_MSI) {
            $uninstallLog = Join-Path `
              $env:GITHUB_WORKSPACE "build/e2e/msi-uninstall.log"
            $process = Start-Process `
              -FilePath msiexec.exe `
              -ArgumentList @(
                "/x", "`"$env:EDIT_ATLAS_E2E_MSI`"", "/qn", "/norestart",
                "/L*V", "`"$uninstallLog`""
              ) `
              -PassThru `
              -Wait
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "MSI uninstall failed with exit code $($process.ExitCode)."
            }
          }
          $registryRoot = `
            "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          foreach ($executable in @("edit-atlas.exe", "edit-atlas-cli.exe")) {
            Remove-Item `
              (Join-Path $registryRoot $executable) `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }
          Remove-Item build/e2e/state -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload Windows E2E reports and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-packaged-e2e-results
          path: |
            build/e2e/reports
            build/e2e/artifacts
            build/e2e/crash-dumps
            build/e2e/output
            build/e2e/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    name: Publish release assets
    if: >-
      always() &&
      needs['create-release'].result == 'success' &&
      needs['prepare-ffmpeg-source'].result == 'success' &&
      needs['prepare-qt-source'].result == 'success' &&
      needs['verify-linux-packages'].result == 'success' &&
      needs['e2e-linux-package'].result == 'success' &&
      needs['e2e-windows-package'].result == 'success' &&
      needs['verify-macos-package'].result == 'success' &&
      needs['verify-windows-package'].result == 'success'
    needs:
      - create-release
      - prepare-ffmpeg-source
      - prepare-qt-source
      - verify-linux-packages
      - e2e-linux-package
      - e2e-windows-package
      - verify-macos-package
      - verify-windows-package
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: widgets-frontend-*-packages
          path: build/release-artifacts
          merge-multiple: true

      - name: Download Qt corresponding source
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-qt-source
          path: build/release-artifacts

      - name: Download FFmpeg corresponding source
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-ffmpeg-source
          path: build/release-artifacts

      - name: Prepare release assets
        run: >-
          ./scripts/ci/prepare-release-assets.sh
          build/release-artifacts
          build/release-assets

      - name: Upload assets and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          build/release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --clobber
          && gh release edit "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --draft=false

      - name: Publish versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run documentation.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF_NAME"
          --field "version=$GITHUB_REF_NAME"

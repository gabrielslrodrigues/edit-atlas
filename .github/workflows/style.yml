name: Style

on:
  workflow_call:

permissions:
  contents: read

jobs:
  style:
    name: Style / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.0

      - name: Bootstrap pinned style tools
        run: cmake -P cmake/BootstrapStyle.cmake

      - name: Check repository style
        run: cmake -P cmake/CheckStyle.cmake

      - name: Verify style enforcement
        run: cmake -P cmake/TestStyle.cmake

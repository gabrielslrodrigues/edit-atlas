name: Packaged E2E

on:
  workflow_call:
    inputs:
      frontend:
        description: Packaged graphical frontend to exercise
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ inputs.frontend }} frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      # A pull request from a fork receives a token that cannot read the
      # registry. Logging in is skipped there, and the provisioner builds the
      # runner image locally, which is its documented fallback rather than a
      # failure. Once the published package is public the login is redundant
      # for pulling, and it is kept so a private package also works.
      - name: Log in to the container registry
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.frontend }}-frontend-x64-linux-packages
          path: build/packages

      - name: Download rendered-video E2E fixtures
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-e2e-media-fixtures
          path: build/e2e/media-fixtures

      # The container shares the host kernel, so a core pattern set here also
      # governs processes inside it. Setting it on the runner is what keeps
      # crash collection working now that the suite runs in a container, which
      # cannot change the pattern itself.
      - name: Configure Linux crash dumps
        run: |
          dump_directory="${GITHUB_WORKSPACE}/build/e2e/crash-dumps"
          mkdir -p "$dump_directory"
          sudo sysctl -w \
            "kernel.core_pattern=${dump_directory}/core.%e.%p.%t"

      # The provisioner a developer runs, unchanged, consuming the runner image
      # published for this checkout. Environment differences between a local
      # run and this one are therefore differences in the image reference,
      # which both sides derive from the same files. The package and fixtures
      # are supplied as inputs; nothing is built or packaged here.
      - name: Run packaged CLI and desktop E2E tests
        run: |
          package="$(
            find build/packages -type f -name '*.deb' -print -quit
          )"
          if [[ -z "${package}" ]]; then
            echo "No Linux package was downloaded." >&2
            exit 1
          fi
          tests/e2e/provision-linux.sh \
            --runtime docker \
            --package "${package}" \
            --media-fixture-dir build/e2e/media-fixtures \
            --artifact-dir build/e2e

      - name: Upload Linux E2E reports and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-packaged-e2e-results-${{ inputs.frontend }}
          path: |
            build/e2e/reports
            build/e2e/artifacts
            build/e2e/crash-dumps
            build/e2e/output
          if-no-files-found: ignore
          retention-days: 7

  macos:
    # GitHub-hosted macOS runners cannot grant Accessibility permission to the
    # test process non-interactively. Keep the implementation visible until a
    # pre-authorized interactive runner is available.
    name: macOS / ${{ inputs.frontend }} frontend (experimental, disabled)
    if: false
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.frontend }}-frontend-universal-osx-packages
          path: build/packages/${{ inputs.frontend }}/universal-osx

      - name: Download rendered-video E2E fixtures
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-e2e-media-fixtures
          path: build/e2e/media-fixtures

      - name: Install generated PKG
        env:
          EDIT_ATLAS_FRONTEND: ${{ inputs.frontend }}
        run: |
          package_directory="build/packages"
          package_directory+="/${EDIT_ATLAS_FRONTEND}/universal-osx"
          packages=()
          while IFS= read -r package; do
            packages+=("${package}")
          done < <(find "$package_directory" -type f -name '*.pkg')
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one PKG, found ${#packages[@]}" >&2
            exit 1
          fi
          if [[ -e /Applications/edit-atlas.app ]]; then
            echo "Package target already exists: /Applications/edit-atlas.app" >&2
            exit 1
          fi
          sudo installer -pkg "${packages[0]}" -target /
          package_id="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' \
              /Applications/edit-atlas.app/Contents/Info.plist
          )"
          echo "EDIT_ATLAS_E2E_PACKAGE_ID=${package_id}" >>"${GITHUB_ENV}"

      - name: Mark macOS crash-report window
        run: |
          mkdir -p build/e2e/crash-dumps
          touch build/e2e/crash-report-start

      - name: Run packaged CLI and desktop E2E tests
        run: |
          tests/e2e/run-macos.sh \
            --app /Applications/edit-atlas.app/Contents/MacOS/edit-atlas \
            --cli /Applications/edit-atlas.app/Contents/MacOS/edit-atlas-cli

      - name: Collect macOS crash reports
        if: always()
        run: |
          ./scripts/ci/collect-macos-crash-reports.sh \
            build/e2e/crash-report-start \
            build/e2e/crash-dumps

      - name: Remove installed package and test state
        if: always()
        run: |
          pkill -x edit-atlas || true
          sudo rm -rf /Applications/edit-atlas.app
          if [[ -n "${EDIT_ATLAS_E2E_PACKAGE_ID:-}" ]]; then
            sudo pkgutil --forget "${EDIT_ATLAS_E2E_PACKAGE_ID}" || true
          fi
          rm -rf build/e2e/state

      - name: Upload macOS E2E reports and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-packaged-e2e-results-${{ inputs.frontend }}
          path: |
            build/e2e/reports
            build/e2e/artifacts
            build/e2e/crash-dumps
            build/e2e/output
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows / ${{ inputs.frontend }} frontend
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.frontend }}-frontend-x64-windows-packages
          path: build/packages/${{ inputs.frontend }}/x64-windows

      - name: Download rendered-video E2E fixtures
        uses: actions/download-artifact@v8
        with:
          name: edit-atlas-e2e-media-fixtures
          path: build/e2e/media-fixtures

      # The harness a Windows Sandbox runs, invoked directly because a hosted
      # runner is already a disposable VM. Dependency installation, MSI
      # installation, crash configuration, suite invocation, cleanup, and exit
      # status therefore behave identically on both sides; only the OS image
      # differs, which this epic accepts for Windows.
      - name: Run packaged CLI and desktop E2E tests
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem build/packages -Recurse -File -Filter *.msi
          )
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSI; found $($packages.Count)."
          }
          tests/e2e/windows/run-provisioned.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -ArtifactRoot (Join-Path $env:GITHUB_WORKSPACE "build/e2e") `
            -Msi $packages[0].FullName `
            -MediaFixtureDir (
              Join-Path $env:GITHUB_WORKSPACE "build/e2e/media-fixtures"
            )

      - name: Upload Windows E2E reports and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-packaged-e2e-results-${{ inputs.frontend }}
          path: |
            build/e2e/reports
            build/e2e/artifacts
            build/e2e/crash-dumps
            build/e2e/output
            build/e2e/*.log
          if-no-files-found: ignore
          retention-days: 7

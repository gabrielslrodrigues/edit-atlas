set noparent
extensions=cpp,hpp
headers=hpp
linelength=80
# The project uses logical include paths and .hpp guards, checked by style.py.
# Google's current guide requests licence boilerplate without author notices.
# <filesystem> is an explicit, deliberate exception to Google's disallowed list.
# Private headers are included by bare name. cpplint classifies an
# angle-bracket third-party header as a system header, so clang-format's
# include categories, not cpplint, own include order.
# clang-format (BasedOnStyle: Google) wraps long statements and nested
# brace-init in ways cpplint's brace/indentation heuristics misread as block
# braces or extra namespace-scope indentation; clang-format's own output is
# authoritative over these three.
filter=-build/header_guard,-legal/copyright,-build/c++17,-build/include_subdir,-build/include_order,-whitespace/braces,-whitespace/indent_namespace,-readability/braces

[project]
name = "edit-atlas-e2e"
version = "0.0.0"
description = "Black-box tests for installed Edit Atlas packages"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dogtail==2.0.4; sys_platform == 'linux'",
  "pycairo==1.29.0; sys_platform == 'linux'",
  "pygobject==3.48.2; sys_platform == 'linux'",
  "pyobjc-core==12.2.1; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices==12.2.1; sys_platform == 'darwin'",
  "pytest==9.1.1",
  "pytest-html==4.2.0",
  "pywinauto==0.6.9; sys_platform == 'win32'",
]

[tool.uv]
package = false
required-version = ">=0.12.3,<0.13"
